name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-cursor0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'src')
        from tests.test_scanner_and_patcher import (
            test_game_scanner_initialization,
            test_quirks_lookup,
            test_custom_game_add_and_remove,
            test_patcher_install_and_clean_unpatch
        )
        test_game_scanner_initialization()
        test_quirks_lookup()
        test_custom_game_add_and_remove()
        test_patcher_install_and_clean_unpatch()
        print('All tests passed!')
        "
